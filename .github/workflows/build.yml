name: Build Kernel Module

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev libdw-dev git curl

      - name: Download GKI Kernel (android16-6.12)
        run: |
          git clone --depth 1 -b android16-6.12 https://android.googlesource.com/kernel/common kernel-source

      - name: Prepare Kernel and Generate Module.symvers
        run: |
          cd kernel-source
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-prebuilt
          CLANG_PATH=$(find $(pwd)/clang-prebuilt -name "clang-r*" -type d | head -n 1)
          export PATH=$CLANG_PATH/bin:$PATH
          make ARCH=arm64 LLVM=1 CC="clang" gki_defconfig
          # A MÁGICA ACONTECE AQUI: Compilar os módulos internos para gerar o Module.symvers
          make ARCH=arm64 LLVM=1 CC="clang" -j$(nproc) modules

      - name: Build Module
        run: |
          cd driver
          CLANG_PATH=$(find $(pwd)/../kernel-source/clang-prebuilt -name "clang-r*" -type d | head -n 1)
          make ARCH=arm64 LLVM=1 CC="${CLANG_PATH}/bin/clang" CROSS_COMPILE=aarch64-linux-gnu- KDIR=../kernel-source

      - name: Upload Module
        uses: actions/upload-artifact@v4
        with:
          name: nb9-driver-ko
          path: driver/nb9_driver.ko
